<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://api.deepseek.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; worker-src 'self' blob: https://cdn.jsdelivr.net;" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <title>ChillPass</title>
  <script>
    // Apply theme before React loads to prevent FOUC
    (function() {
      try {
        var stored = localStorage.getItem('chillpass-theme');
        var theme = 'light';
        if (stored) {
          var parsed = JSON.parse(stored);
          if (parsed && parsed.state && parsed.state.theme) {
            theme = parsed.state.theme;
          }
        }
        var root = document.documentElement;
        root.removeAttribute('data-theme');
        root.removeAttribute('data-theme-vista');
        root.removeAttribute('data-theme-win95');
        if (theme === 'dark') {
          root.setAttribute('data-theme', 'dark');
        } else if (theme === 'vista') {
          root.setAttribute('data-theme', 'vista');
        } else if (theme === 'win95') {
          root.setAttribute('data-theme', 'win95');
        } else if (theme === 'codex') {
          root.setAttribute('data-theme', 'codex');
        }
        // light = no attribute needed (CSS default)
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
